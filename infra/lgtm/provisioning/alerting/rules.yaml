  - uid: ddd-hikari-pending
    title: Hikari has threads waiting for connections
    condition: C
    noDataState: NoData
    execErrState: Error
    annotations:
      summary: Hikari có luồng chờ kết nối
      description: Kiểm tra truy vấn chậm hoặc pool đã hết kết nối.
    labels:
      severity: warning
      component: ddd-platform
      service: modular-app
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        expr: sum by (container) (hikaricp_connections_pending{service="modular-app"})
        instant: true
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
        refId: C
    for: 2m
  - uid: ddd-http-5xx
    title: Spring HTTP 5xx exceeds 0.1 requests/sec
    condition: C
    noDataState: KeepLast
    execErrState: Error
    annotations:
      summary: HTTP 5xx vượt 0,1 yêu cầu/giây
      description: 'Tốc độ HTTP 5xx của {{ $labels.service }}: {{ printf "%.3f" $values.B.Value }} req/s; ngưỡng
        >0.1 req/s trên cửa sổ 5 phút, giữ 2 phút. Xem HTTP audit để tìm route/status; metrics không chứa exception.'
      __dashboardUid__: ddd-jvm-hikari
      __panelId__: '8'
    labels:
      severity: warning
      component: ddd-platform
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        expr: sum by (service) (rate(http_server_requests_seconds_count_total{status=~"5..",uri!~"/actuator.*"}[5m]))
          or on(service) (0 * sum by (service) (rate(http_server_requests_seconds_count_total[5m])))
        instant: true
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
