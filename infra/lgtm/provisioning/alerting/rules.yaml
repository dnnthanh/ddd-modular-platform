        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        expr: redis_up
        instant: true
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
        refId: C
    for: 1m
  - uid: ddd-app-missing-replicas
    title: Application replicas below desired
    condition: C
    noDataState: Alerting
    execErrState: Error
    annotations:
      summary: Số replica ứng dụng thấp hơn cấu hình
      description: Kiểm tra các replica modular-app và số replica mong muốn.
    labels:
      severity: warning
      component: ddd-platform
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        expr: ddd_service_replicas_desired{service="modular-app"} - ddd_service_replicas_healthy{service="modular-app"}
        instant: true
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
        refId: C
    for: 3m
  - uid: ddd-jvm-high-heap
    title: JVM heap > 85%
    condition: C
    noDataState: NoData
    execErrState: Error
    annotations:
      summary: Bộ nhớ heap JVM vượt 85%
      description: Kiểm tra tải ứng dụng, GC và cấu hình heap trên dashboard Runtime.
    labels:
      severity: warning
      component: ddd-platform
      service: modular-app
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        expr: 100 * sum by (container) (jvm_memory_used_bytes{service="modular-app",area="heap"}) / clamp_min(sum
          by (container) (jvm_memory_max_bytes{service="modular-app",area="heap"}),1)
        instant: true
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 85
        refId: C
    for: 5m
  - uid: ddd-hikari-high-usage
    title: Hikari active connections > 85%
    condition: C
    noDataState: NoData
    execErrState: Error
    annotations:
      summary: Kết nối Hikari đang sử dụng vượt 85%
      description: Kiểm tra truy vấn chậm và mức sử dụng connection pool.
    labels:
      severity: warning
      component: ddd-platform
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        expr: 100 * hikaricp_connections_active{service="modular-app"} / clamp_min(hikaricp_connections_max{service="modular-app"},1)
        instant: true
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
