# Provisioned Grafana alert rules, contact point optional.
apiVersion: 1
groups:
- orgId: 1
  name: ddd-runtime-alerts
  # Share the dashboard folder; the old lower-case title created an empty-looking duplicate.
  folder: DDD Platform
  interval: 1m
  rules:
  - uid: ddd-app-replicas-zero
    title: 'CRITICAL: All application replicas stopped'
    condition: C
    noDataState: Alerting
    execErrState: Error
    annotations:
      summary: No modular-app container is running.
      description: Check Grafana dashboards (Runtime, Infrastructure, Operations)
        and logs by trace.
    labels:
      severity: critical
      component: ddd-platform
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        expr: ddd_service_replicas_running{service="modular-app"}
        instant: true
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
        refId: C
    for: 1m
  - uid: ddd-gateway-down
    title: 'CRITICAL: Gateway stopped'
    condition: C
    noDataState: Alerting
    execErrState: Error
    annotations:
      summary: 'CRITICAL: Gateway stopped'
