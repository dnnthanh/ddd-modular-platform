apiVersion: 1
groups:
- orgId: 1
  name: ddd-runtime-alerts
  folder: DDD Platform
  interval: 1m
  rules:
  - uid: ddd-app-replicas-zero
    title: 'CRITICAL: All application replicas stopped'
    condition: C
    noDataState: Alerting
    execErrState: Error
    annotations:
      summary: Toàn bộ replica ứng dụng đã dừng
      description: Kiểm tra container modular-app và kết nối PostgreSQL/Redis.
    labels:
      severity: critical
      component: ddd-platform
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        expr: ddd_service_replicas_running{service="modular-app"}
        instant: true
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
        refId: C
    for: 1m
  - uid: ddd-gateway-down
    title: 'CRITICAL: Gateway stopped'
    condition: C
    noDataState: Alerting
    execErrState: Error
    annotations:
      summary: API Gateway đã dừng
      description: Kiểm tra container gateway và cấu hình khởi động.
    labels:
      severity: critical
      component: ddd-platform
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        expr: ddd_service_replicas_running{service="gateway"}
        instant: true
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
        refId: C
    for: 1m
  - uid: ddd-postgres-down
    title: 'CRITICAL: PostgreSQL unavailable'
    condition: C
    noDataState: Alerting
    execErrState: Error
    annotations:
      summary: PostgreSQL không khả dụng
      description: Kiểm tra sức khỏe PostgreSQL và kết nối exporter.
    labels:
      severity: critical
      component: ddd-platform
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        expr: pg_up
        instant: true
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
        refId: C
    for: 1m
  - uid: ddd-redis-down
    title: 'CRITICAL: Redis unavailable'
    condition: C
    noDataState: Alerting
    execErrState: Error
    annotations:
      summary: Redis không khả dụng
      description: Kiểm tra sức khỏe Redis và kết nối exporter.
    labels:
      severity: critical
      component: ddd-platform
