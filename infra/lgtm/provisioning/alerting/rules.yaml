        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 40
        refId: C
    for: 5m
  - uid: ddd-redis-high-memory
    title: Redis configured memory > 85%
    condition: C
    noDataState: NoData
    execErrState: Error
    annotations:
      summary: Bộ nhớ Redis vượt 85% giới hạn
      description: Kiểm tra dung lượng cache và cấu hình giới hạn bộ nhớ Redis.
    labels:
      severity: warning
      component: ddd-platform
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        expr: 100 * redis_memory_used_bytes / clamp_min(redis_memory_max_bytes,1)
        instant: true
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 85
        refId: C
    for: 5m
  - uid: ddd-postgres-deadlocks
    title: PostgreSQL deadlocks in last 10m
    condition: C
    noDataState: NoData
    execErrState: Error
    annotations:
      summary: PostgreSQL phát sinh deadlock trong 10 phút
      description: Kiểm tra giao dịch đồng thời và thứ tự khóa dữ liệu.
    labels:
      severity: warning
      component: ddd-platform
      service: postgres
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        expr: sum(increase(pg_stat_database_deadlocks_total{datname="modulardb"}[10m]))
        instant: true
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
        refId: C
    for: 1m
  - uid: ddd-containers-cpu-high
    title: Service CPU spike > 90% of one core
    condition: C
    noDataState: NoData
    execErrState: Error
    annotations:
      summary: CPU dịch vụ vượt 90% một lõi
      description: Kiểm tra tải và mức dùng CPU trên dashboard Operations.
    labels:
      severity: warning
      component: ddd-platform
    data:
