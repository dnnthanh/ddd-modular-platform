        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 85
        refId: C
    for: 3m
  - uid: ddd-postgres-high-connections
    title: PostgreSQL connections > 40
    condition: C
    noDataState: NoData
    execErrState: Error
    annotations:
      summary: Số kết nối PostgreSQL vượt 40
      description: Kiểm tra connection pool và các kết nối đang hoạt động.
    labels:
      severity: warning
      component: ddd-platform
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        expr: pg_stat_database_numbackends{datname="modulardb"}
        instant: true
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
