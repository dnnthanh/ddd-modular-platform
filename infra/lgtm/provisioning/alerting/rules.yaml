  - uid: ddd-eureka-down
    title: Eureka registry stopped
    condition: C
    noDataState: NoData
    execErrState: Error
    annotations:
      summary: Eureka Registry đã dừng
      description: Kiểm tra container eureka và khả năng đăng ký dịch vụ.
    labels:
      severity: warning
      component: ddd-platform
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        expr: ddd_service_replicas_running{service="eureka"}
        instant: true
        refId: A
        intervalMs: 1000
