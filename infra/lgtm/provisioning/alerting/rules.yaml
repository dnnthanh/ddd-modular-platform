        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        expr: ddd_container_cpu_percent{service=~"modular-app|postgres|redis"}
        instant: true
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 90
        refId: C
    for: 5m
  - uid: ddd-exporter-scrape-failed
    title: Exporter metrics collection failed
    condition: C
    noDataState: Alerting
    execErrState: Error
    annotations:
      summary: Không thu thập được metrics dịch vụ
      description: Kiểm tra exporter, endpoint metrics và kết nối của observer.
    labels:
      severity: warning
      component: ddd-platform
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: prometheus
      model:
        datasource:
          type: prometheus
          uid: prometheus
        expr: ddd_metrics_scrape_success{service=~"postgres|redis|modular-app|gateway|eureka"}
        instant: true
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
        refId: B
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: lt
            params:
            - 1
        refId: C
    for: 2m
  - uid: ddd-observer-down
    title: Docker observer unavailable
    condition: C
    noDataState: Alerting
    execErrState: Error
    annotations:
      summary: Docker observer không khả dụng
      description: Kiểm tra ops-observer và Docker socket proxy.
    labels:
      severity: critical
      component: ddd-platform
