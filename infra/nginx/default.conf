limit_req_zone $binary_remote_addr zone=per_ip:10m rate=15r/s;
server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    proxy_connect_timeout 3s;
    proxy_read_timeout 35s;
    proxy_send_timeout 35s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / {
        limit_req zone=per_ip burst=25 nodelay;
        limit_req_status 429;
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
# Demo HTTP is intentionally bound to 127.0.0.1:8088 on the host.
# For internet production use HTTPS via managed TLS/edge proxy or explicit nginx:443 TLS config.
