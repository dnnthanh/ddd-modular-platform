# Upstream versions checked against Docker Hub / Quay on 2026-10-14.
# Pin full release versions; upgrades are explicit.
# Application images remain :local because they are built from this source.
name: ddd-platform
x-java-otel: &java_otel
  # Instrumentation enabled; operator can disable it for the file-log fallback.
  OTEL_ENABLED: ${OTEL_ENABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms64m -Xmx256m}
  OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
  OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
  OTEL_LOGS_EXPORTER: none  # structured stdout -> Alloy -> Loki; avoid duplicate OTLP export
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=local,service.namespace=ddd-platform
x-java-health: &java_health
  test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 80s
services:
  nginx:
    image: nginx:1.31.6-alpine
    ports:
      - "${EDGE_BIND:-127.0.0.1}:${EDGE_PORT:-8088}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      gateway: {condition: service_started}
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
  gateway:
    image: ddd/gateway:local
    ports:
      - "${LOCAL_BIND:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    build:
      context: .
      args: {MODULE: api-gateway, RELEASE_TAG: local, GIT_REVISION: "${GIT_REVISION:-unknown}"}
    environment:
      <<: *java_otel
      JAVA_TOOL_OPTIONS: ${GATEWAY_JAVA_OPTIONS:--Xms32m -Xmx192m}
      OTEL_SERVICE_NAME: api-gateway
      EUREKA_URL: http://eureka:8761/eureka/
      REDIS_HOST: redis
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:8088}
      JWT_ISSUER: ${JWT_ISSUER:-ddd-platform-dev}
      JWT_PUBLIC_KEY: file:/run/secrets/jwt-public.pem
      GATEWAY_RATE_LIMIT_REPLENISH: ${GATEWAY_RATE_LIMIT_REPLENISH:-20}
      GATEWAY_RATE_LIMIT_BURST: ${GATEWAY_RATE_LIMIT_BURST:-40}
      GATEWAY_RATE_LIMIT_TOKENS: ${GATEWAY_RATE_LIMIT_TOKENS:-1}
    volumes:
      - ./.logs/gateway:/app/logs
      - ./secrets/jwt/public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      eureka: {condition: service_started}
      redis: {condition: service_healthy}
    networks: [edge, application]
    healthcheck: *java_health
    restart: unless-stopped
    stop_grace_period: 35s
    security_opt: ["no-new-privileges:true"]
  eureka:
    image: ddd/eureka:local
    ports:
      - "${LOCAL_BIND:-127.0.0.1}:${EUREKA_PORT:-8761}:8761"
    build:
      context: .
      args: {MODULE: discovery-server, RELEASE_TAG: local, GIT_REVISION: "${GIT_REVISION:-unknown}"}
    environment:
      <<: *java_otel
      JAVA_TOOL_OPTIONS: ${EUREKA_JAVA_OPTIONS:--Xms32m -Xmx128m}
      OTEL_SERVICE_NAME: eureka-server
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    volumes:
      - ./.logs/eureka:/app/logs
    networks: [application, eureka_access]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 80s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  modular-app:
    image: ddd/modular-app:local
    ports:
      - "${LOCAL_BIND:-127.0.0.1}:${APP_PORT_RANGE:-18081-18130}:8080"
    # Dev bind-mounted PEM is mode 0600: run with its host owner UID/GID.
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    build:
      context: .
      args: {MODULE: modular-monolith, RELEASE_TAG: local, GIT_REVISION: "${GIT_REVISION:-unknown}"}
    scale: ${APP_REPLICAS:-1}
    environment:
      <<: *java_otel
      OTEL_SERVICE_NAME: modular-app
      EUREKA_URL: http://eureka:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/modulardb
      SPRING_DATASOURCE_USERNAME: run
      SPRING_DATASOURCE_PASSWORD: ${DB_RUN_PASSWORD:?Set_DB_RUN_PASSWORD}
      HTTP_AUDIT_ENABLED: ${HTTP_AUDIT_ENABLED:-true}
      HTTP_AUDIT_LOG_BODIES: ${HTTP_AUDIT_LOG_BODIES:-true}
      HTTP_AUDIT_MAX_BODY_BYTES: ${HTTP_AUDIT_MAX_BODY_BYTES:-8192}
      HTTP_AUDIT_MAX_QUERY_CHARS: ${HTTP_AUDIT_MAX_QUERY_CHARS:-2048}
      HIKARI_MAX_POOL_SIZE: ${HIKARI_MAX_POOL_SIZE:-8}
      HIKARI_MIN_IDLE: ${HIKARI_MIN_IDLE:-2}
      EXECUTOR_CORE_SIZE: ${EXECUTOR_CORE_SIZE:-4}
      EXECUTOR_MAX_SIZE: ${EXECUTOR_MAX_SIZE:-16}
      EXECUTOR_QUEUE_CAPACITY: ${EXECUTOR_QUEUE_CAPACITY:-200}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set_BOOTSTRAP_ADMIN_PASSWORD}
      REDIS_HOST: redis
      JWT_ISSUER: ${JWT_ISSUER:-ddd-platform-dev}
      JWT_PUBLIC_KEY: file:/run/secrets/jwt-public.pem
      JWT_PRIVATE_KEY: file:/run/secrets/jwt-private.pem
      JWT_TTL: ${JWT_TTL:-15m}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:8088}
      CATALOG_ITEM_CACHE_TTL: ${CATALOG_ITEM_CACHE_TTL:-5m}
    volumes:
      - ./.logs/modular-app:/app/logs
      - ./secrets/jwt/public.pem:/run/secrets/jwt-public.pem:ro
      - ./secrets/jwt/private.pem:/run/secrets/jwt-private.pem:ro
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      eureka: {condition: service_started}
    networks: [application, data, modular_app_access]
    healthcheck: *java_health
    restart: unless-stopped
    stop_grace_period: 45s
    security_opt: ["no-new-privileges:true"]
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: modular
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set_DB_PASSWORD}
      POSTGRES_DB: modulardb
      DB_RUN_PASSWORD: ${DB_RUN_PASSWORD:?Set_DB_RUN_PASSWORD}
      DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD:?Set_DB_BACKUP_PASSWORD}
    # PostgreSQL 18+ stores versioned PGDATA under this parent directory.
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modular -d modulardb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  # Runs pg_dump now and at the start of every hour; no Docker socket or host port.
  postgres-backup:
    image: ddd/postgres-backup:local
    build:
      context: .
      dockerfile: infra/backup/Dockerfile
    user: "${APP_UID:-10001}:${APP_GID:-10001}"
    entrypoint: ["/bin/sh", "/backup-app/launcher.sh"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: backup
      PGDATABASE: modulardb
      PGPASSWORD: ${DB_BACKUP_PASSWORD:?Set_DB_BACKUP_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./.backups/postgres:/backups
      # Keep the Vietnamese text template editable without rebuilding the image.
      - ./infra/lgtm/resources/backup-notification-template.json:/backup-app/backup-notification-template.json:ro
    tmpfs: ["/tmp"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: {condition: service_healthy}
    # This service is the only backup-status sender and needs HTTPS egress to
    # Telegram. Its PostgreSQL access remains confined to the data network.
    networks: [data, egress]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "/backup-app/health.sh"]
      interval: 15m
      timeout: 60s
      start_interval: 10s
      start_period: 1m
      retries: 2
  redis:
    image: redis:8.10.2-alpine
    volumes: ["redis_data:/data"]
    command: ["redis-server", "--save", "", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
    networks: [application]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
  # Prometheus-format exporters are scraped by ops-observer, then sent to
  # the existing LGTM OTLP receiver. No separate Prometheus/Tempo stack.
  postgres-exporter:
    profiles: ["observability"]
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: postgres:5432/modulardb?sslmode=disable
      DATA_SOURCE_USER: run
      DATA_SOURCE_PASS: ${DB_RUN_PASSWORD:?Set_DB_RUN_PASSWORD}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [data, observability]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  redis-exporter:
    profiles: ["observability"]
    image: oliver006/redis_exporter:v1.93.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis: {condition: service_healthy}
    networks: [application, observability]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  # Grafana's upstream docker-otel-lgtm all-in-one bundle provides
  # Grafana, Loki, Tempo, Prometheus, and an OTLP receiver together.
  lgtm:
    profiles: ["observability"]
    image: grafana/otel-lgtm:0.36.0
    ports:
      - "${GRAFANA_BIND:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set_GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Explicit browser URL: set HTTPS domain on VPS; generated alert links use it.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/}
      # LGTM defaults provision Prometheus/Loki/Tempo/Pyroscope; do not add a second set.
      GF_PATHS_PROVISIONING: /otel-lgtm/grafana/conf/provisioning
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - lgtm_data:/data
      # Keep Loki Java logs separate from Grafana/metrics/traces storage.
      - loki_java_data:/data/loki
      - ./infra/lgtm/dashboards:/var/lib/grafana/dashboards/ddd:ro
      # Extend the upstream JVM dashboard in place, keeping its existing UID/provider.
      - ./infra/lgtm/resources/jvm-overview.json:/otel-lgtm/grafana-dashboard-jvm-metrics.json:ro
      - ./infra/lgtm/provisioning/ddd.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/ddd.yaml:ro
      # Custom datasource definitions are kept commented in the source, not mounted.
      # - ./infra/lgtm/provisioning/datasources.yaml:/etc/grafana/provisioning/datasources/ddd.yaml:ro
      - ./infra/lgtm/provisioning/alerting:/otel-lgtm/grafana/conf/provisioning/alerting:ro
    # A non-internal network is needed for host-published Grafana port on Docker Desktop.
    networks: [application, observability, grafana_ui]
    restart: unless-stopped
  # Restrict Docker API to inspection; do not expose raw Docker socket to Grafana.
  docker-socket-proxy:
    profiles: ["observability"]
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      EVENTS: "1"
      POST: "0"
      AUTH: "0"
      BUILD: "0"
      EXEC: "0"
      INFO: "0"
      # Alloy Docker discovery reads network labels; POST remains disabled.
      NETWORKS: "1"
      SERVICES: "0"
      SYSTEM: "0"
      VOLUMES: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker_api]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
  # Docker stdout/stderr logs cannot be inferred from Java's OTLP traces alone.
  # Alloy forwards them to the Loki already contained in lgtm.
  alloy:
    profiles: ["observability"]
    image: grafana/alloy:v1.20.1
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy"]
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy
    depends_on: [docker-socket-proxy, lgtm]
    networks: [docker_api, observability]
    restart: unless-stopped
  # Metrics and Docker lifecycle metadata are sent over OTLP HTTP to lgtm.
  ops-observer:
    profiles: ["observability"]
    image: python:3.15.0-alpine3.24
    command: ["python", "-u", "/app/observer.py"]
    working_dir: /app
    environment:
      DOCKER_HOST_HTTP: http://docker-socket-proxy:2375
      OTEL_METRICS_ENDPOINT: http://lgtm:4318/v1/metrics
      DDD_PROJECT: ddd-platform
      POLL_SECONDS: "15"
      POSTGRES_EXPORTER_URL: http://postgres-exporter:9187/metrics
      REDIS_EXPORTER_URL: http://redis-exporter:9121/metrics
    volumes:
      - ./infra/observer/observer.py:/app/observer.py:ro
      - ./infra/observer/scrape_metrics.py:/app/scrape_metrics.py:ro
      - ./.deploy:/state:ro
    depends_on: [docker-socket-proxy, lgtm, postgres-exporter, redis-exporter]
    networks: [docker_api, observability, application]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
networks:
  eureka_access: {driver: bridge}
  modular_app_access: {driver: bridge}
  edge: {driver: bridge}
  grafana_ui: {driver: bridge}
  application: {driver: bridge, internal: true}
  data: {driver: bridge, internal: true}
  observability: {driver: bridge, internal: true}
  docker_api: {driver: bridge, internal: true}
  # The backup container alone needs outbound access to Telegram's HTTPS API.
  egress: {driver: bridge}
volumes:
  loki_java_data: {}
  redis_data: {}
  postgres_data: {}
  lgtm_data: {}
  alloy_data: {}
