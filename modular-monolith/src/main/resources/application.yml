server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:100}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:10}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:4096}
spring:
  application:
    name: modular-app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/modulardb}
    username: ${SPRING_DATASOURCE_USERNAME:modular}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      pool-name: modular-hikari
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:8}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${HIKARI_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${HIKARI_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${HIKARI_KEEPALIVE_MS:120000}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/master.xml
  lifecycle:
    timeout-per-shutdown-phase: 30s
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: false
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    # Container entrypoint sets EUREKA_INSTANCE_IP_ADDRESS from route to Eureka.
    # Without the env var, Eureka client performs its usual address detection.
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
app:
  json:
    trim:
      enabled: true
  cache:
    catalog:
      item-ttl: ${CATALOG_ITEM_CACHE_TTL:5m}
  logging:
    http:
      enabled: ${HTTP_AUDIT_ENABLED:true}
      log-bodies: ${HTTP_AUDIT_LOG_BODIES:true}
      max-body-bytes: ${HTTP_AUDIT_MAX_BODY_BYTES:8192}
      max-query-chars: ${HTTP_AUDIT_MAX_QUERY_CHARS:2048}
      body-paths:
        - /api/private/catalog/**
      excluded-paths:
        - /actuator/**
        - /error
        - /api/public/auth/**
        - /api/private/auth/**
  security:
    jwt:
      public-key: ${JWT_PUBLIC_KEY:file:./secrets/jwt/public.pem}
      private-key: ${JWT_PRIVATE_KEY:file:./secrets/jwt/private.pem}
      issuer: ${JWT_ISSUER:ddd-platform-dev}
      ttl: ${JWT_TTL:15m}
    refresh:
      ttl: ${REFRESH_TOKEN_TTL:30d}
    cookies:
      secure: ${AUTH_COOKIE_SECURE:true}
      same-site: ${AUTH_COOKIE_SAME_SITE:Strict}
      path: ${AUTH_COOKIE_PATH:/api}
      domain: ${AUTH_COOKIE_DOMAIN:}
      allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:8088}
    bootstrap-admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  executors:
    application:
      core-size: ${EXECUTOR_CORE_SIZE:4}
      max-size: ${EXECUTOR_MAX_SIZE:16}
      queue-capacity: ${EXECUTOR_QUEUE_CAPACITY:200}
management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
